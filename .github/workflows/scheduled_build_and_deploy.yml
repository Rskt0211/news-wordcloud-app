name: Scheduled Data Update & Frontend Build

# 毎日 06:00, 18:00 UTC（日本時間 15:00, 03:00）に実行
on:

push:
    branches:
         - beta
schedule:
    - cron: "0 6,18 * * *"
workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) リポジトリ丸ごとチェックアウト（履歴も含めて）
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Python & 依存インストール
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Python deps
        run: pip install -r backend/requirements.txt

      # 3) データ更新バッチを実行 → backend/data/YYYY-MM-DD_hh-mm 配下に json/png が生成される
      - name: Run data update batch
        run: python backend/main.py

      # 4) Node.js のセットアップ & Frontend の依存インストール
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install JS deps
        run: npm ci
        working-directory: frontend

      # 5) Frontend ビルド → docs 以下に成果物が出力される (vite.config.js の outDir='../docs' が効く)
      - name: Build Frontend
        run: npm run build
        working-directory: frontend

      # 6) 最新の data を docs/static 配下へコピー
      - name: Copy latest static data
        run: |
          LATEST=$(ls backend/data | sort | tail -n1)
          mkdir -p docs/static/$LATEST
          cp -r backend/data/$LATEST/* docs/static/$LATEST/

      # 7) docs & backend/data 以下をコミットして beta ブランチへプッシュ
      - name: Commit & Push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs backend/data
          git diff --quiet --cached \
            || ( git commit -m "ci: update data ($LATEST) and rebuild frontend" \
                 && git push origin beta )
