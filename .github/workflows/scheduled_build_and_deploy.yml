name: Scheduled Data Update & Frontend Build

on:
  # beta ブランチに push されたとき
  push:
    branches:
      - beta

  # 毎日 06:00, 18:00 UTC（日本時間 15:00, 03:00）
  schedule:
    - cron: '0 6,18 * * *'

  # 手動トリガー
  workflow_dispatch:

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install -r backend/requirements.txt

      - name: Run data update batch
        run: python backend/main.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install JS deps
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Copy latest static data
        run: |
          LATEST=$(ls backend/data | sort | tail -n1)
          mkdir -p docs/static/$LATEST
          cp -r backend/data/$LATEST/* docs/static/$LATEST/

      - name: Commit & Push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --quiet --cached \
            || ( git commit -m "ci: update data ($LATEST) and rebuild frontend" \
                 && git push origin beta )
