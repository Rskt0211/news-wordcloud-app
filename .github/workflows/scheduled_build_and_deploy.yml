# .github/workflows/scheduled_build_and_deploy.yml
name: Scheduled Data Update & Frontend Build

on:
  push:
    branches:
      - beta
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    env:
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ── Python 環境セットアップ
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ── backend/requirements.txt を install → バッチ実行
      - name: Install backend deps & run batch
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python main.py batch

      # ── 最新フォルダを docs/static 配下へコピー
      - name: Copy latest static data
        run: |
          LATEST=$(ls backend/data | sort | tail -n1)
          mkdir -p docs/static/$LATEST
          cp -r backend/data/$LATEST/* docs/static/$LATEST/

      # ── フロントエンドビルド
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install JS deps
        working-directory: frontend
        run: npm ci
      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # ── docs & data をコミット＆プッシュ (beta)
      - name: Commit & Push updates
        run: |
          # GitHub Actions の Push を走らせるためのユーザ設定
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs backend/data
          git diff --quiet --cached || (
            git commit -m "ci: update data ($LATEST) and rebuild frontend"
            git push origin beta
          )
