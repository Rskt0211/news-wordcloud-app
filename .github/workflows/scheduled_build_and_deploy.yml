# .github/workflows/scheduled_build_and_deploy.yml
name: Scheduled Data Update & Frontend Build

permissions:
  contents: write
  pages:   write

on:
  push:
    branches:
      - beta
  schedule:
    - cron: '0 6,18 * * *'   # 毎日 06:00,18:00 UTC (日本時間 15:00,03:00)
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install backend deps & run batch
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python main.py batch

      - name: Copy latest static data
        run: |
          LATEST=$(ls backend/data | sort | tail -n1)
          echo "LATEST=$LATEST"
          mkdir -p docs/static/$LATEST
          cp -r backend/data/$LATEST/* docs/static/$LATEST/
          # フロントエンド用に最新タイムスタンプを JSON でも出力
          echo "[\"$LATEST\"]" > docs/static/latest.json

      - name: Debug docs/static
        run: |
         echo ">>> ls docs/static"
         ls -R docs/static

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install JS deps
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Commit & Push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs backend/data
          git diff --quiet --cached || (
            git commit -m "ci: update data ($LATEST) and rebuild frontend"
            git push origin beta
          )
