# .github/workflows/scheduled_build_and_deploy.yml
name: Scheduled Data Update & Frontend Build

on:
  push:
    branches:
      - beta
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    # ここでジョブ全体にシークレットを注入
    env:
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ── Python 環境
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Python deps
        run: pip install -r backend/requirements.txt

      # ── データ更新バッチ実行
      - name: Run data update batch
        working-directory: backend
        # .env を使わず、上で渡した env:NEWSAPI_KEY を参照します
        run: |
         # Python／依存をインストールして
         pip install -r backend/requirements.txt
         # batch モードで実行 -> update_all_categories() のみ実行して終了
         python backend/main.py batch  

      # ── 最新フォルダを docs/static 配下へコピー
      - name: Copy latest static data
        run: |
          LATEST=$(ls backend/data | sort | tail -n1)
          mkdir -p docs/static/$LATEST
          cp -r backend/data/$LATEST/* docs/static/$LATEST/

      # ── フロントエンドビルド
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install JS deps
        working-directory: frontend
        run: npm ci
      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # ── docs をコミット＆プッシュ (beta)
      - name: Commit & Push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs backend/data
          git diff --quiet --cached \
            || ( git commit -m "ci: update data ($LATEST) and rebuild frontend" \
                 && git push origin beta )
